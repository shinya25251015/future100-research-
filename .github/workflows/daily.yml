name: daily collection

# 観測履歴を 1 日ぶんずつ積み、リポジトリにコミットする。
# Early Signal Detection は baseline 期間（既定 28 日）ぶんの観測履歴が貯まるまで
# 判定を保留し続けるため、まず毎日走り続けること自体が要件になる (§10)。

on:
  schedule:
    # 毎日 21:30 UTC（日本時間 06:30）。00 分ちょうどは GitHub 側が混雑して遅延しやすい
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation extras
        run: pip install jsonschema referencing

      - name: Run daily cycle
        # SEC EDGAR は User-Agent に連絡先を要求する。リポジトリの Secrets に
        # FUTURE100_CONTACT_EMAIL を設定すると Form D（資金調達シグナル）が有効になる。
        # 未設定でもそのソースが失敗するだけで、他のソースは通常どおり収集される。
        env:
          FUTURE100_CONTACT_EMAIL: ${{ secrets.FUTURE100_CONTACT_EMAIL }}
        run: python3 scripts/daily.py

      - name: Run tests
        run: |
          for f in tests/test_*.py; do python3 "$f" || exit 1; done

      - name: Commit observation history
        run: |
          git config user.name "future100-bot"
          git config user.email "noreply@github.com"
          # 日次サイクルが書き出すのは data/（観測履歴）と reports/（日次レポート）の両方。
          # 片方だけ add すると作業ツリーが汚れたままになり、後続の rebase が止まる。
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "no new observations"
            exit 0
          fi
          git commit -m "observations: $(date -u +%Y-%m-%d)"
          # 同時刻に他の push があった場合に備えて rebase してから送る。
          # --autostash は取りこぼした未追跡・未ステージの変更で止まらないための保険。
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
